[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hddid"
version = "0.1.0"
description = "Doubly robust semiparametric difference-in-differences estimators with high-dimensional data."
requires-python = ">=3.10"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Xuanyu Cai"},
    {name = "Wenli Xu"},
]
maintainers = [
    {name = "Xuanyu Cai"},
    {name = "Wenli Xu"},
]
keywords = [
    "causal inference",
    "difference-in-differences",
    "high-dimensional statistics",
    "semiparametric estimation",
    "doubly robust",
    "treatment effects",
    "econometrics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/gorgeousfish/hddid-py"
Documentation = "https://hddid-py.readthedocs.io"
Repository = "https://github.com/gorgeousfish/hddid-py"
"Bug Tracker" = "https://github.com/gorgeousfish/hddid-py/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
release = ["build>=1.2", "twine>=5.0"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme", "sphinx-autodoc-typehints", "myst-parser"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not research_probe"]
markers = [
    "reviewer: reviewer-facing package, manuscript, replication, source, and submission-boundary checks",
    "research_probe: internal exploratory Monte Carlo, trigger, closeout, and automation-state probes that are not submission gates",
    "slow: long-running performance and scalability checks",
]
